app = "worldzk-generator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# The binary takes its port and mock mode from flags, not from env. The image
# CMD is `--mock --host 0.0.0.0 --port 3100`.
[env]
  RUST_LOG = "info"
  LOG_FORMAT = "json"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[vm]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
