name: E2E Smoke Test

permissions: read-all

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'services/**'
      - 'scripts/smoke-test.sh'
  pull_request:
    paths:
      - 'contracts/**'
      - 'sdk/**'
      - 'services/**'
      - 'scripts/smoke-test.sh'
  workflow_dispatch:

jobs:
  e2e-smoke:
    name: Deploy + Submit + Challenge + Finalize
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: cd contracts && forge build

      # Starts its own Anvil on a free port, deploys with DeployFullStack and
      # walks the TEE lifecycle: register enclave, submit, challenge, resolve,
      # finalize, plus the admin paths.
      - name: Run smoke test
        run: bash scripts/smoke-test.sh

  compose-e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 120

      - name: Verify services are healthy
        run: |
          echo "Checking service health..."
          docker compose -f docker-compose.test.yml ps
          # Verify anvil is responding
          docker compose -f docker-compose.test.yml exec -T anvil cast block-number --rpc-url http://localhost:8545
          # Verify enclave health
          docker compose -f docker-compose.test.yml exec -T enclave curl -sf http://localhost:8080/health
          echo "All services healthy"

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker-compose-test:
    name: Docker Compose Test Suite
    runs-on: ubuntu-latest
    needs: e2e-smoke
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker-compose.test.yml
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-runner
        timeout-minutes: 10

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
