name: Deploy Docs
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: cargo install mdbook
      - name: Build
        run: mdbook build docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/
      - id: deployment
        uses: actions/deploy-pages@v4
