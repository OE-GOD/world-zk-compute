---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The manifests live in base/. Kustomize refuses a base directory that
# contains the overlay that includes it ("cycle detected"), so the overlays
# under overlays/ build on base/ and this file keeps
# `kubectl apply -k deploy/k8s` working.
resources:
  - base
